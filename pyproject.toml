[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swiggy-lyr"
version = "0.1.0"
description = "Unified Swiggy MCP server - Food, Instamart & Dineout for AI agents"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
swiggy-lyr = "swiggy_lyr.cli_main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["swiggy_lyr*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",   # line length handled by the formatter
    "B008",   # FastMCP DI pattern (ctx: Context)
    "BLE001", # upstream boundaries deliberately catch-all and re-map
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
